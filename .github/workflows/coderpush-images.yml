name: CoderPush main images

# Build immutable artifacts from main. Publishing images does not deploy them.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coderpush-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'CoderPush/multica' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: multica-backend
            dockerfile: Dockerfile
          - image: multica-web
            dockerfile: Dockerfile.web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/coderpush/${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/CoderPush/multica
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=main-${{ github.sha }}
            COMMIT=${{ github.sha }}
            NEXT_PUBLIC_APP_VERSION=main-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
